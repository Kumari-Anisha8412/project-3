<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ProChronos - Precision modern digital stopwatch with lap statistics, interactive timer ring, keyboard shortcuts, and sound effects.">
    <title>ProChronos • Precision Stopwatch & Lap Timer</title>
    
    <!-- Google Fonts: Plus Jakarta Sans for UI, JetBrains Mono for Timer -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <main class="stopwatch-card">
        <!-- App Header -->
        <header class="app-header">
            <div class="brand">
                <span class="brand-icon">⏱️</span>
                <div>
                    <h1 class="brand-title">ProChronos</h1>
                    <p class="brand-subtitle">Precision Lap Timer</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="soundToggleBtn" class="icon-btn" title="Toggle Sound (M)" aria-label="Toggle Sound">
                    <svg id="soundOnIcon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                    <svg id="soundOffIcon" class="icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Circular Display Area -->
        <div class="timer-display-wrapper">
            <svg class="progress-ring" viewBox="0 0 300 300">
                <defs>
                    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#38bdf8" />
                        <stop offset="50%" stop-color="#818cf8" />
                        <stop offset="100%" stop-color="#c084fc" />
                    </linearGradient>
                    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <circle class="ring-bg" cx="150" cy="150" r="130" />
                <circle id="progressCircle" class="ring-progress" cx="150" cy="150" r="130" filter="url(#glowEffect)" />
            </svg>

            <div class="timer-center-content">
                <div class="status-pill" id="statusBadge">
                    <span class="status-dot"></span>
                    <span id="statusText">READY</span>
                </div>

                <div id="display" class="digital-display" aria-live="polite">
                    <span id="mainTime" class="main-digits">00:00:00</span>
                    <span class="ms-wrapper">
                        <span class="ms-dot">.</span>
                        <span id="msDigits" class="ms-digits">00</span>
                    </span>
                </div>

                <div class="current-lap-preview" id="currentLapPreview">
                    <span class="preview-label">Lap <span id="currentLapIndex">1</span></span>
                    <span id="currentLapTime">00:00.00</span>
                </div>
            </div>
        </div>

        <!-- Primary Control Buttons -->
        <div class="controls-group">
            <button id="startPauseBtn" class="btn btn-primary" title="Start / Pause (Space)">
                <svg id="playIcon" class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <svg id="pauseIcon" class="btn-icon hidden" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                    <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                </svg>
                <span id="startPauseText">Start</span>
            </button>

            <button id="lapBtn" class="btn btn-secondary" disabled title="Record Lap (L)">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                    <line x1="4" y1="22" x2="4" y2="15"></line>
                </svg>
                <span>Lap</span>
            </button>

            <button id="resetBtn" class="btn btn-danger" disabled title="Reset Stopwatch (R)">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
                <span>Reset</span>
            </button>
        </div>

        <!-- Lap Statistics Section (Dynamic) -->
        <section class="lap-stats-container hidden" id="lapStatsSection">
            <div class="stat-card stat-fastest">
                <span class="stat-badge">⚡ Fastest</span>
                <span class="stat-value" id="fastestLapVal">--:--.--</span>
                <span class="stat-lap-no" id="fastestLapNo">Lap -</span>
            </div>
            <div class="stat-card stat-avg">
                <span class="stat-badge">⚖️ Average</span>
                <span class="stat-value" id="avgLapVal">--:--.--</span>
                <span class="stat-lap-no">Overall</span>
            </div>
            <div class="stat-card stat-slowest">
                <span class="stat-badge">🐢 Slowest</span>
                <span class="stat-value" id="slowestLapVal">--:--.--</span>
                <span class="stat-lap-no" id="slowestLapNo">Lap -</span>
            </div>
        </section>

        <!-- Lap Times List Section -->
        <section class="laps-section">
            <div class="laps-header">
                <div class="laps-title-box">
                    <h2>Lap Records</h2>
                    <span id="lapCountBadge" class="count-badge">0</span>
                </div>
                <div class="laps-actions">
                    <button id="copyLapsBtn" class="action-btn" title="Copy Laps to Clipboard" disabled>
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span>Copy</span>
                    </button>
                    <button id="clearLapsBtn" class="action-btn" title="Clear All Laps" disabled>
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        <span>Clear</span>
                    </button>
                </div>
            </div>

            <!-- Empty State -->
            <div id="lapEmptyState" class="lap-empty">
                <p>No laps recorded yet</p>
                <span>Click "Lap" while the timer is running or press <kbd>L</kbd></span>
            </div>

            <!-- Lap List -->
            <ul id="lapList" class="lap-list"></ul>
        </section>

        <!-- Keyboard Shortcuts Hint Bar -->
        <footer class="shortcuts-footer">
            <span class="shortcut-chip"><kbd>Space</kbd> Start/Pause</span>
            <span class="shortcut-chip"><kbd>L</kbd> Lap</span>
            <span class="shortcut-chip"><kbd>R</kbd> Reset</span>
            <span class="shortcut-chip"><kbd>M</kbd> Sound</span>
        </footer>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- Bulletproof script loading for case-sensitive GitHub Pages (Script.js / script.js) -->
    <script src="Script.js" onerror="this.onerror=null;this.src='script.js';"></script>
</body>
</html>
